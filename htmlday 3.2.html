<!DOCTYPE html>
<style>
body * {
  margin: 0;
  padding: 0;
  box-sizing: border- box;
  font family: Arial, Helvetica, sans-scrif;
}
.keyboard- base {
  max-width: 1085px;
  padding: 20px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: rgba(197, 197, 197);
  border- radius: 10px;
  display: grid;
  grid-template-columns: repeat(30, 30px);
  grid-template-rows: repeat(5, 60px);
  grid-gap: 5px;
}
.key{
  background-color: rgba(243, 243, 243);
  border: 2px solid black;
  border- radius: 5px;
  grid-column: span 2;
  font- size: 20px;
  text-align: center;
  padding-top: 17px;
}
.keyhover {
  border: 1px solid #eeeeee;
}
.delete {
  grid-column: span 4;
}
.tab {
  grid-column: span 3;
}
.backslash {
  grid-column: span 3;
}
.capslock {
  grid-column: span 4;
}
.return {
  grid-column: span 4;
}
.leftshift {
  grid-column: span 5;
}
.rightshift {
  grid-column: span 5;
}
.leftctrl {
  grid-column: span 3;
}
.command {
  grid-column: span 3;
  font- size: 14px;
}
.space {
  grid-column: span 13;
}
.special {
  grid-column: span 4;
}
</style>
<body>
  <div class="Keyboard-base">
    <div class="Key">~</div>
